<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.15" />
    </filter>
    <linearGradient id="seaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7ec8df" />
      <stop offset="100%" stop-color="#4ea3c8" />
    </linearGradient>
    <linearGradient id="landGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8f5eb" />
      <stop offset="100%" stop-color="#f1ece1" />
    </linearGradient>
  </defs>

  <!-- Land Base -->
  <rect width="700" height="450" fill="url(#landGrad)" />

  <!-- Green Parks & Open Spaces -->
  <path d="M 50 40 Q 120 30 180 80 T 150 160 Q 80 180 40 120 Z" fill="#d9eed9" opacity="0.8" />
  <path d="M 450 60 Q 520 40 590 90 T 560 170 Q 480 160 440 110 Z" fill="#d9eed9" opacity="0.8" />
  <path d="M 280 20 Q 360 10 400 50 T 350 100 Q 290 90 270 50 Z" fill="#e2f4e8" opacity="0.7" />

  <!-- Coastline & Sea (Teluk Lampung) -->
  <path d="M 0 350 Q 120 310 240 330 T 420 380 Q 530 400 700 370 L 700 450 L 0 450 Z" fill="url(#seaGrad)" />
  <path d="M 0 348 Q 120 308 240 328 T 420 378 Q 530 398 700 368" fill="none" stroke="#bfe5ed" stroke-width="4" opacity="0.7" />

  <!-- Coastal Waves decoration -->
  <path d="M 60 380 Q 110 375 160 382" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5" />
  <path d="M 220 395 Q 280 390 340 398" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5" />
  <path d="M 460 415 Q 520 410 580 418" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5" />

  <!-- Roads Network (Secondary) -->
  <g stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <line x1="80" y1="0" x2="160" y2="330" />
    <line x1="260" y1="0" x2="290" y2="340" />
    <line x1="430" y1="0" x2="400" y2="360" />
    <line x1="560" y1="0" x2="520" y2="370" />
    <line x1="0" y1="120" x2="700" y2="100" />
    <line x1="0" y1="210" x2="700" y2="230" />
    <line x1="20" y1="280" x2="680" y2="300" />
  </g>

  <!-- Roads Network (Primary Highways) -->
  <g stroke="#f8cca4" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Jl. Raden Intan -->
    <path d="M 120 0 L 220 180 L 320 270 L 450 370" />
    <!-- Jl. Kartini / Diponegoro -->
    <path d="M 0 160 L 240 180 L 460 170 L 700 200" />
    <!-- Coastal Boulevard (Jl. Yos Sudarso) -->
    <path d="M 0 310 Q 150 280 300 310 T 550 340 L 700 330" />
  </g>

  <!-- Street labels -->
  <g font-family="Arial, sans-serif" font-size="11" fill="#7d7465" font-weight="600" letter-spacing="0.5">
    <text x="180" y="110" transform="rotate(45 180, 110)">JL. RADEN INTAN</text>
    <text x="320" y="165">JL. KARTINI</text>
    <text x="80" y="270" transform="rotate(5 80, 270)">JL. KOTA BANDAR LAMPUNG</text>
    <text x="260" y="360">TELUK LAMPUNG</text>
  </g>

  <!-- District Header Banner -->
  <g filter="url(#shadow)">
    <rect x="180" y="20" width="340" height="38" rx="19" fill="#ffffff" />
    <text x="350" y="44" font-family="'Outfit', sans-serif" font-size="14" font-weight="800" fill="#1b4332" text-anchor="middle" letter-spacing="1.5">BANDAR LAMPUNG TOWN CENTER</text>
  </g>

  <!-- Hospital Pin (RSIA Restu Bunda) -->
  <g transform="translate(340, 205)" filter="url(#shadow)">
    <!-- Pulse ring -->
    <circle cx="0" cy="0" r="28" fill="#10b981" opacity="0.25">
      <animate attributeName="r" values="24;36;24" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    
    <!-- Marker Icon -->
    <path d="M 0 -36 C -14 -36 -24 -24 -24 -10 C -24 8 0 28 0 28 C 0 28 24 8 24 -10 C 24 -24 14 -36 0 -36 Z" fill="#047857" />
    <circle cx="0" cy="-14" r="14" fill="#ffffff" />
    <!-- Medical Cross -->
    <rect x="-3" y="-22" width="6" height="16" rx="2" fill="#047857" />
    <rect x="-8" y="-17" width="16" height="6" rx="2" fill="#047857" />

    <!-- Tooltip Card -->
    <g transform="translate(18, -48)">
      <rect x="0" y="0" width="190" height="46" rx="10" fill="#111827" opacity="0.9" />
      <polygon points="0,20 -10,23 0,26" fill="#111827" opacity="0.9" />
      <text x="14" y="20" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" fill="#ffffff">RSIA Restu Bunda</text>
      <text x="14" y="36" font-family="sans-serif" font-size="10" fill="#9ca3af">Pusat Layanan Ibu &amp; Anak</text>
    </g>
  </g>
</svg>
